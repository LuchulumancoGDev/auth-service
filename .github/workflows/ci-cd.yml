name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: luchulumancogdev/auth-service

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AuthApi.sln

      - name: Build
        run: dotnet build AuthApi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AuthApi.sln --configuration Release --no-build


  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: AuthApi/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}


  deploy-dev:
    name: Deploy Dev
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy DEV
        run: |
          echo "Deploy DEV"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev


  deploy-staging:
    name: Deploy Staging
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Deploy STAGING
        run: |
          echo "Deploy STAGING"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging


  deploy-prod:
    name: Deploy Production
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy PRODUCTION
        run: |
          echo "Deploy PRODUCTION"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
